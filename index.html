<!DOCTYPE html>
<html lang="es-MX"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cortes semanales</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f3f5f8;color:#1d2430}
header{background:#0f766e;color:#fff;padding:14px 16px}header h1{margin:0;font-size:1.25rem}
main{max-width:1100px;margin:auto;padding:12px}.panel{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}label{font-size:.85rem;display:flex;flex-direction:column;gap:4px}
input,button,textarea{font:inherit}input{padding:8px;border:1px solid #cbd5e1;border-radius:8px}
button{padding:8px 12px;border:0;border-radius:8px;background:#0f766e;color:#fff;cursor:pointer}button.sec{background:#e2e8f0;color:#1d2430}button.wa{background:#25d366}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px #0002;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:1rem;display:flex;justify-content:space-between;align-items:center}
pre[hidden]{display:none}pre{white-space:pre-wrap;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px;font-size:.8rem;max-height:280px;overflow:auto;margin:0}
.tag{font-size:.7rem;background:#ccfbf1;color:#115e59;padding:2px 6px;border-radius:6px}
.pay{display:flex;flex-wrap:wrap;gap:6px}.pay input{flex:1;min-width:80px}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:6px;border-bottom:1px solid #e2e8f0;text-align:left}
.bad{color:#dc2626;font-weight:600}.ok{color:#15803d}#msg{font-size:.85rem;color:#475569}
#cola{position:sticky;top:0;z-index:10;background:#fef9c3;border:1px solid #facc15;border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sent{font-size:.75rem;color:#15803d;font-weight:600}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}.kpi{background:#f8fafc;border-radius:8px;padding:8px}.kpi small{display:block;color:#475569}.kpi b{font-size:1.05rem}
.card.revisar{background:#ffedd5;border:3px solid #ea580c;box-shadow:0 0 0 3px #fdba74}.badge{background:#ea580c;color:#fff;font-weight:700;border-radius:8px;padding:4px 8px;font-size:.85rem}.otl{background:#fff7ed;border:1px solid #fb923c;border-radius:8px;padding:6px;font-size:.85rem}.sp{color:#dc2626;font-weight:800}#revisar{background:#ffedd5;border:3px solid #ea580c}.qrev{background:#ea580c;color:#fff;padding:2px 6px;border-radius:6px;font-weight:700}
.tabs{display:flex;gap:6px;max-width:1100px;margin:10px auto 0;padding:0 12px}.tabs button{flex:1;padding:12px;font-size:1rem;background:#e2e8f0;color:#1d2430;border-radius:10px}.tabs button.on{background:#0f766e;color:#fff;font-weight:700}[hidden]{display:none!important}
.gear{background:none;color:#475569;padding:2px 6px;font-size:1.1rem}
</style></head><body>
<header><h1>📋 Cortes semanales <small style="font-size:.7rem;opacity:.8">v9</small></h1><label style="font-size:13px">Abrir con: <select id="waApp"><option value="b">Business directo</option><option value="n">WhatsApp normal</option><option value="s">Menú compartir</option></select></label></header>
<nav class="tabs"><button id="tabC" class="on">Clientes</button><button id="tabP">Proveedores</button><button id="tabX">Comparación</button></nav>
<main>
<div id="secC">
<div class="panel"><div class="row">
<label>Desde<input type="date" id="desde"></label><label>Hasta<input type="date" id="hasta"></label>
<button id="cargar">Cargar datos</button><button class="sec" id="todo">Enviar todo a Cortes</button><button class="wa" id="todos">Enviar a todos</button>
</div><div id="msg"></div></div>
<div id="cola" hidden></div><div id="faltan" class="panel" hidden></div><div id="revisar" class="panel" hidden></div><div id="resumen" class="panel" hidden></div>
<div id="cortes" class="grid"></div>
<div class="panel"><h2 style="margin-top:0;font-size:1.1rem">Diferencias</h2>
<div style="overflow-x:auto"><table id="dif"></table></div>
<p><button class="sec" id="csv">Exportar pagos (CSV)</button></p></div>
</div>
<div id="secP" hidden>
<div class="panel"><div class="row">
<label>Desde<input type="date" id="pdesde"></label><label>Hasta<input type="date" id="phasta"></label>
<button id="pcargar">Cargar datos</button><button class="sec" id="phistBtn">Historial de pagos</button>
</div><div id="pmsg" style="font-size:.85rem;color:#475569"></div></div>
<div id="presumen" class="panel" hidden></div>
<div id="pcortes" class="grid"></div>
<div id="phist" class="panel" hidden></div>
</div>
<div id="secX" hidden>
<div class="panel"><div class="row">
<label>Desde<input type="date" id="xdesde"></label><label>Hasta<input type="date" id="xhasta"></label>
<button id="xcargar">Cargar/Comparar</button><button class="sec" id="xeqBtn">Equivalencias</button>
</div><div id="xmsg" style="font-size:.85rem;color:#475569"></div></div>
<div id="xeq" class="panel" hidden></div>
<div class="panel"><div style="overflow-x:auto"><table id="xtab"></table></div></div>
</div>
<div id="pmodal" hidden style="position:fixed;inset:0;background:#000d;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px"><button id="pmclose" style="position:absolute;top:10px;right:10px">✕ Cerrar</button><div id="pmbody" style="max-width:100%;max-height:92vh;overflow:auto"></div></div>
<div id="ppago" hidden style="position:fixed;inset:0;background:#0008;z-index:40;display:flex;align-items:center;justify-content:center;padding:10px"><div class="panel" style="width:100%;max-width:420px;margin:0">
<h3 style="margin-top:0" id="pptit">Registrar pago</h3>
<label>Monto pagado<input type="number" step="0.01" id="ppmonto"></label>
<label>Fecha de pago<input type="date" id="ppfecha"></label>
<label>Nota<input id="ppnota" placeholder="Ej. transferencia BBVA"></label>
<label>Comprobante (imagen)<input type="file" accept="image/*" id="ppimg"></label>
<img id="ppprev" style="max-width:100%;max-height:200px;display:none;margin-top:6px">
<div class="row" style="margin-top:10px"><button id="ppok">Guardar pago</button><button class="sec" id="ppcan">Cancelar</button></div></div></div>
</main>
<script>
/*CORE-START*/
const SHEET='1ksLCPzOJoUcp7lKqjV_BMIjvB0fPtbyK7kT6C8jPCbM';
const URLS=['https://docs.google.com/spreadsheets/d/'+SHEET+'/export?format=csv&gid=0',
 'https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tqx=out:csv&gid=0'];
const MESES={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12};
function parseCSV(t){const R=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);R.push(r);r=[];f=''}else f+=c}
 if(f||r.length){r.push(f);R.push(r)}return R}
function num(v){if(v==null)return 0;v=String(v).replace(/[$,\s]/g,'');if(v==''||v=='-')return 0;const n=parseFloat(v);return isNaN(n)?0:n}
function parseFecha(s){s=String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 const m=s.match(/(\d{1,2})\s+de\s+([a-z]+)\s+de\s+(\d{4})/);if(m&&MESES[m[2]])return m[3]+'-'+String(MESES[m[2]]).padStart(2,'0')+'-'+m[1].padStart(2,'0');
 const d=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(d)return d[3]+'-'+d[2].padStart(2,'0')+'-'+d[1].padStart(2,'0');return null}
const norm=h=>String(h||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
// tramite: header de cantidad, etiqueta, clave santi
const TRAM=[['ACTAS','Actas',10],['ACTAS POR DATOS','Acta por datos',70],['SEMANAS VIGENCIAS','Semanas cotizadas / vigencias',10],
 ['CFE/NSS','CFE/NSS/No IMSS/CURP',5],['RFC EXPRESS','RFC económico/Express',30],['RFC DOM','RFC con domicilio fiscal',40],
 ['RFC CON ID CIF','RFC con ID/CIF',50],['RFC NORMAL','RFC normal',70],['RFC ALTERNO','RFC alterno',145],['NO PENAL','Antecedentes penales',70],
 ['FECHA RETIRO','Fecha de retiro',50],['CITAS SAT','Citas SAT',230]];
function mapCols(H){const h=H.map(norm),M={tr:[]};const f=x=>h.findIndex(v=>v==x);
 M.fecha=f('FECHA');M.cliente=f('CLIENTE');M.gestor=f('GESTOR');M.abonos=f('ABONOS');M.otros=f('OTROS TRAMITES');M.costo=f('COSTO');M.total=f('TOTAL A PAGAR');M.subdia=f('SUBTOTAL POR DIA');
 for(const[k,lab,sp]of TRAM){const q=k=='CFE/NSS'?h.findIndex(v=>v.startsWith('CFE/NSS')):f(k);if(q<0)continue;
  // siguientes columnas hasta el siguiente SUBTOTAL: PRECIO? y SUBTOTAL
  let p=-1,s=-1;for(let j=q+1;j<Math.min(q+3,h.length);j++){if(h[j].startsWith('PRECIO'))p=j;if(h[j].startsWith('SUBTOTAL')){s=j;break}}
  M.tr.push({lab,sp,q,p,s})}return M}
const RESETEO=150;const sinAc=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const isReset=v=>/reset/.test(sinAc(v));
function resetQty(v){const t=sinAc(v).trim();if(/^\d+(\.\d+)?$/.test(t))return parseFloat(t)||1;const m=t.match(/(\d+)\s*(x\s*)?reset/)||t.match(/reset\w*\s*(?:x\s*)?(\d+)/);return m?parseInt(m[1]):1}
function parseRows(text){const R=parseCSV(text);const M=mapCols(R[0]);const out=[];
 for(const r of R.slice(1)){if(!r.some(c=>String(c).trim()))continue;const cl=(r[M.cliente]||'').trim();
  if(norm(r[M.fecha])=='CUENTA')continue;const fecha=parseFecha(r[M.fecha]);if(!fecha)continue;
  const g=norm(r[M.gestor]);const items=[];
  for(const t of M.tr){const qty=num(r[t.q]);if(qty<=0)continue;const sub=t.s>=0?num(r[t.s]):0;
   const unit=t.p>=0?num(r[t.p]):(qty?sub/qty:0);items.push({tramite:t.lab,cantidad:qty,unit,subtotal:sub||unit*qty,santi:t.sp})}
  for(let j=0;j<r.length;j++){const v=String(r[j]||'').trim();if(!isReset(v))continue;const q=resetQty(v);items.push({tramite:'Reseteo',cantidad:q,unit:RESETEO,subtotal:q*RESETEO,santi:RESETEO,reseteo:true})}
  if(M.otros>=0&&String(r[M.otros]||'').trim()&&!isReset(r[M.otros])){const c=num(r[M.costo]);const _ot=r[M.otros].trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();if(/estado\s*de\s*cuenta/.test(_ot)){const q=parseInt((_ot.match(/^(\d+)/)||[0,1])[1])||1;const pc=c>0?c/q:(g=='CANEK'?100:80);items.push({tramite:'Estado de cuenta'+(/infonavit/.test(_ot)?' Infonavit':''),cantidad:q,unit:pc,subtotal:pc*q,santi:null})}else items.push({tramite:'Otros: '+r[M.otros].trim(),cantidad:1,unit:c,subtotal:c,santi:null,otros:true,texto:r[M.otros].trim(),sinPrecio:!(c>0)})}
  out.push({fecha,cliente:cl,gestor:g,items,abono:M.abonos>=0?num(r[M.abonos]):0,subdia:M.subdia>=0?num(r[M.subdia]):0})}
 return out}
function buildCortes(rows,desde,hasta){const sel=rows.filter(r=>r.fecha>=desde&&r.fecha<=hasta);const G={};
 for(const r of sel){if(!r.items.length&&!r.abono)continue;const key=r.gestor=='CANEK'?'CANEK|'+r.cliente.trim().toUpperCase():r.gestor||'SIN GESTOR';
  (G[key]=G[key]||{id:key,gestor:r.gestor,cliente:r.gestor=='CANEK'?r.cliente.trim():null,lineas:[],abonos:[]});
  for(const it of r.items){const u=r.gestor=='SANTI'&&it.santi!=null?it.santi:it.unit;G[key].lineas.push({cliente:r.cliente.trim(),fecha:r.fecha,tramite:it.tramite,otros:!!it.otros,sinPrecio:!!it.sinPrecio,texto:it.texto||'',cantidad:it.cantidad,unit:u,subtotal:r.gestor=='SANTI'&&it.santi!=null?u*it.cantidad:it.subtotal})}
  if(r.abono)G[key].abonos.push({cliente:r.cliente.trim(),fecha:r.fecha,monto:r.abono})}
 return Object.values(G).map(c=>{c.subtotal=c.lineas.reduce((a,l)=>a+l.subtotal,0);c.totalAbonos=c.abonos.reduce((a,b)=>a+b.monto,0);c.total=c.subtotal-c.totalAbonos;c.otros=c.lineas.filter(l=>l.otros);c.revisar=c.otros.length>0;c.desde=desde;c.hasta=hasta;c.texto=textoCorte(c);return c})
  .sort((a,b)=>a.id.localeCompare(b.id))}
const $m=n=>'$'+n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=s=>{const[y,m,d]=s.split('-');return d+'/'+m+'/'+y};
function textoCorte(c){const L=[];L.push('*CORTE '+(c.cliente?c.cliente:'GESTOR '+c.gestor)+'*');L.push('Del '+fd(c.desde)+' al '+fd(c.hasta));L.push('');
 let last='';for(const l of c.lineas){const h=fd(l.fecha)+(c.cliente?'':' · '+l.cliente);if(h!=last){L.push('📅 *'+h+'*');last=h}
  L.push('• '+l.tramite+': '+(l.otros&&l.sinPrecio?'SIN PRECIO':l.cantidad+' x '+$m(l.unit)+' = '+$m(l.subtotal)))}
 L.push('');L.push('Subtotal: '+$m(c.subtotal));
 if(c.abonos.length){for(const a of c.abonos)L.push('Abono '+fd(a.fecha)+(c.cliente?'':' ('+a.cliente+')')+': -'+$m(a.monto));}
 L.push('*TOTAL A PAGAR: '+$m(c.total)+'*');return L.join('\n')}
if(typeof module!='undefined')module.exports={parseRows,buildCortes};
/*CORE-END*/
if(typeof document!='undefined'){
var ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},ss=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let CORTES=[];const msg=t=>document.getElementById('msg').textContent=t;
const today=new Date(),iso=d=>d.toISOString().slice(0,10);
document.getElementById('hasta').value=ls('hasta',iso(today));document.getElementById('desde').value=ls('desde',iso(new Date(today-6*864e5)));
async function fetchCSV(){let err;for(const u of URLS){try{const r=await fetch(u+'&_='+Date.now());if(r.ok){const t=await r.text();if(/FECHA/i.test(t.slice(0,300)))return t}}catch(e){err=e}}throw err||new Error('Sin respuesta')}
document.getElementById('cargar').onclick=async()=>{const d=desde.value,h=hasta.value;if(!d||!h)return msg('Elige fechas');ss('desde',d);ss('hasta',h);msg('Cargando…');
 try{const rows=parseRows(await fetchCSV());CORTES=buildCortes(rows,d,h);ss('ultimos',CORTES);render();msg(CORTES.length+' cortes generados ('+new Date().toLocaleTimeString('es-MX')+')')}catch(e){msg('Error al cargar: '+e.message)}};
const envKey=c=>'enviado:'+c.id+':'+c.desde+':'+c.hasta;
const pagoKey=c=>'pago:'+c.id+':'+c.desde+':'+c.hasta;
const OPEN=new Set();
function render(){const box=document.getElementById('cortes');box.innerHTML='';const phones=ls('telefonos',{});
 for(const c of CORTES){const el=document.createElement('div');el.className='card'+(c.revisar?' revisar':'');const pagos=ls(pagoKey(c),[]);const pag=pagos.reduce((a,p)=>a+p.monto,0);
  el.innerHTML=`<h3><span class="tg" style="cursor:pointer;flex:1"><span class="ar">${OPEN.has(c.id)?'▾':'▸'}</span> ${c.cliente||c.gestor} <span class="tag">${c.cliente?'Cliente Canek':'Gestor'}</span></span><button class="gear" title="Teléfono">⚙️</button></h3>
  <div class="cfg" hidden><label>Teléfono WhatsApp (con 52)<input class="tel" inputmode="numeric" placeholder="52XXXXXXXXXX" value="${phones[c.id]||''}"></label><button class="sec savetel">Guardar</button></div>
  ${c.revisar?`<div class="badge">⚠ Revisar otros trámites</div><div class="otl">${(c.otros||[]).map(l=>`${fd(l.fecha)} · ${esc(l.cliente)}: <b>${esc(l.texto)}</b> — ${l.sinPrecio?'<span class="sp">SIN PRECIO</span>':$m(l.subtotal)}`).join('<br>')}</div>`:''}<pre ${OPEN.has(c.id)?'':'hidden'}></pre><div class="row"><button class="sec cp">Copiar</button><button class="wa send">Enviar</button><b style="margin-left:auto">${$m(c.total)}</b></div>${ls(envKey(c),null)?`<div class="sent">✔ Enviado ${fd(ls(envKey(c),''))}</div>`:''}
  <div class="pay"><input type="number" step="0.01" placeholder="Monto" class="pm"><input type="date" class="pd" value="${iso(new Date())}"><input placeholder="Nota" class="pn"><button class="reg">Registrar pago</button></div>
  <div>Pagado: <b>${$m(pag)}</b> · Diferencia: <b class="${Math.abs(c.total-pag)>0.009?'bad':'ok'}">${$m(c.total-pag)}</b>${pagos.length?` <a href="#" class="clr">borrar pagos</a>`:''}</div>`;
  el.querySelector('pre').textContent=c.texto;
  el.querySelector('.tg').onclick=()=>{const x=el.querySelector('pre');x.hidden=!x.hidden;x.hidden?OPEN.delete(c.id):OPEN.add(c.id);el.querySelector('.ar').textContent=x.hidden?'▸':'▾'};
  el.querySelector('.gear').onclick=()=>{const x=el.querySelector('.cfg');x.hidden=!x.hidden};
  el.querySelector('.savetel').onclick=()=>{const p=ls('telefonos',{});p[c.id]=el.querySelector('.tel').value.replace(/\D/g,'');ss('telefonos',p);render()};
  el.querySelector('.cp').onclick=()=>navigator.clipboard.writeText(c.texto).then(()=>msg('Copiado: '+(c.cliente||c.gestor)));
  el.querySelector('.send').onclick=()=>{const t=ls('telefonos',{})[c.id];if(!t){el.querySelector('.cfg').hidden=false;return msg('Configura el teléfono con ⚙️')}abrirWA(t,c.texto);ss(envKey(c),iso(new Date()));render()};
  el.querySelector('.reg').onclick=()=>{const m=parseFloat(el.querySelector('.pm').value);if(!(m>0))return msg('Monto inválido');const p=ls(pagoKey(c),[]);p.push({monto:m,fecha:el.querySelector('.pd').value,nota:el.querySelector('.pn').value});ss(pagoKey(c),p);render()};
  const clr=el.querySelector('.clr');if(clr)clr.onclick=e=>{e.preventDefault();if(confirm('¿Borrar pagos de este corte?')){localStorage.removeItem(pagoKey(c));render()}};
  box.appendChild(el)}
 const t=document.getElementById('dif');t.innerHTML='<tr><th>Corte</th><th>Total</th><th>Pagado</th><th>Diferencia</th></tr>';
 for(const c of CORTES){const pag=ls(pagoKey(c),[]).reduce((a,p)=>a+p.monto,0),d=c.total-pag;t.innerHTML+=`<tr><td>${c.cliente||c.gestor}</td><td>${$m(c.total)}</td><td>${$m(pag)}</td><td class="${Math.abs(d)>0.009?'bad':'ok'}">${$m(d)}</td></tr>`}
 renderResumen();renderRevisar()}
const esc=s=>String(s).replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
function renderRevisar(){const R=document.getElementById('revisar');const F=CORTES.filter(c=>c.revisar);if(!F.length){R.hidden=true;return}R.hidden=false;
 R.innerHTML=`<h2 style="margin-top:0;font-size:1.1rem">⚠ Por revisar: cortes con otros trámites (${F.length})</h2>`+F.map(c=>`<div style="margin-bottom:6px"><b>${esc(nom(c))}</b>: `+(c.otros||[]).map(l=>`${fd(l.fecha)} · ${esc(l.cliente)} — ${esc(l.texto)} — ${l.sinPrecio?'<span class="sp">SIN PRECIO</span>':$m(l.subtotal)}`).join('; ')+'</div>').join('')}
document.getElementById('todo').onclick=()=>{if(!CORTES.length)return msg('Primero carga datos');const ph=ls('telefonos',{});
 const b={generado:new Date().toISOString(),desde:CORTES[0].desde,hasta:CORTES[0].hasta,cortes:CORTES.map(c=>({id:c.id,destinatario:c.cliente||c.gestor,tipo:c.cliente?'cliente_canek':'gestor',telefono:ph[c.id]||null,total:c.total,abonos:c.totalAbonos,lineas:c.lineas,texto:c.texto}))};
 const txt='CORTES '+b.desde+' a '+b.hasta+'\n\n'+CORTES.map(c=>c.texto).join('\n\n-----\n\n')+'\n\n```json\n'+JSON.stringify(b)+'\n```';
 navigator.clipboard.writeText(txt).catch(()=>{});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='cortes_'+b.desde+'_'+b.hasta+'.txt';a.click();msg('Paquete copiado y descargado: pégalo en el chat con tu asistente')};

function pParse(text){const R=parseCSV(text);const H=R[0].map(h=>String(h||'').trim());const U=H.map(norm);
 const iP=U.indexOf('PROVEEDOR'),iT=U.indexOf('TOTAL'),iF=U.indexOf('FECHA');const Q=[];

 const out=[];for(const r of R.slice(1)){const f=parseFecha(r[iF]);const p=String(r[iP]||'').trim().toUpperCase().replace(/\s+/g,' ');if(!f||!p)continue;
  const it=[];let sub=0;for(const q of Q){const c=num(r[q.j]),st=q.s>=0?num(r[q.s]):0;sub+=st;if(c||st)it.push({t:q.lab,c,st})}
  const tot=num(r[iT]);if(!it.length&&!tot)continue;out.push({fecha:f,prov:p,items:it,total:tot,sub})}return out}

 return Object.values(G).map(c=>{c.monto=Math.round(c.monto*100)/100;c.lineas.sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);c.texto=pTexto(c);return c}).sort((a,b)=>a.prov.localeCompare(b.prov))}

function pM(n){return '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}
function pTexto(c){const L=['*CORTE PROVEEDOR '+c.prov+'*','Del '+pFd(c.desde)+' al '+pFd(c.hasta),''];let f='';
 for(const l of c.lineas){if(l.fecha!=f){f=l.fecha;L.push('📅 '+pFd(f))}L.push('  • '+l.t+': '+l.c)}
 L.push('','*MONTO A PAGAR: '+pM(c.monto)+'*','','Por favor confirma si el corte está correcto ✅');return L.join('\n')}

 try{await pagoPut(p)}catch(e){return alert('No se pudo guardar: '+e.message)}
 const s=estado(c);s.pagado={fecha:f,monto:m,montoCorte:c.monto,id:p.id};ss(stKey(c),s);$('ppago').hidden=true;render();if(!$('phist').hidden)renderHist();
 if(Math.abs(m-c.monto)>0.009)alert('Atención: el monto pagado ('+pM(m)+') difiere del corte ('+pM(c.monto)+'). Diferencia '+pM(m-c.monto))};
function modal(html){$('pmbody').innerHTML=html;$('pmodal').hidden=false}
$('pmclose').onclick=()=>{$('pmodal').hidden=true};
async function renderHist(){const H=$('phist');H.hidden=false;let all=[];try{all=await pagosAll()}catch(e){H.textContent='Error IndexedDB: '+e.message;return}
 const q=(ls('pv_hfiltro','')||'').toUpperCase();const L=all.filter(p=>!q||p.prov.includes(q));
 H.innerHTML=`<h2 style="margin-top:0;font-size:1.1rem">Historial de pagos (${all.length})</h2>
 <div class="row" style="margin-bottom:8px"><label style="flex:1">Buscar proveedor<input id="phq" value="${esc(q)}"></label><button class="sec" id="phexp">Exportar respaldo (JSON)</button><label class="sec" style="background:#e2e8f0;padding:8px 12px;border-radius:8px;cursor:pointer">Importar respaldo<input type="file" accept="application/json,.json" id="phimp" hidden></label></div>
 <div style="overflow-x:auto"><table><tr><th>Proveedor</th><th>Rango</th><th>Fecha pago</th><th>Monto</th><th>Monto corte</th><th>Diferencia</th><th></th></tr>${L.map(p=>{const d=p.monto-p.montoCorte;return `<tr><td>${esc(p.prov)}</td><td>${pFd(p.desde)}–${pFd(p.hasta)}</td><td>${pFd(p.fechaPago)}</td><td>${pM(p.monto)}</td><td>${pM(p.montoCorte)}</td><td class="${Math.abs(d)>0.009?'bad':'ok'}">${pM(d)}</td><td style="white-space:nowrap"><button class="sec hv" data-id="${esc(p.id)}">Ver comprobante</button> <button class="sec hc" data-id="${esc(p.id)}">Ver corte</button></td></tr>${p.nota?`<tr><td colspan="7" style="font-size:.8rem;color:#475569">Nota: ${esc(p.nota)}</td></tr>`:''}`}).join('')||'<tr><td colspan="7">Sin pagos registrados</td></tr>'}</table></div>`;
 const qi=$('phq');qi.oninput=()=>{ss('pv_hfiltro',qi.value);clearTimeout(qi._t);qi._t=setTimeout(()=>{renderHist().then(()=>{const n=$('phq');n.focus();n.setSelectionRange(n.value.length,n.value.length)})},300)};
 const byId=id=>all.find(p=>p.id==id);
 H.querySelectorAll('.hv').forEach(b=>b.onclick=()=>{const p=byId(b.dataset.id);modal(p.img?`<img src="${p.img}" style="max-width:100%;max-height:90vh;display:block">`:'<div class="panel">Este pago no tiene comprobante</div>')});
 H.querySelectorAll('.hc').forEach(b=>b.onclick=()=>{const p=byId(b.dataset.id);modal(`<div class="panel" style="max-width:600px"><pre style="max-height:none">${esc(p.snapshot.texto)}</pre><p>Pagado: <b>${pM(p.monto)}</b> el ${pFd(p.fechaPago)}${p.nota?' · '+esc(p.nota):''}</p></div>`)});
 $('phexp').onclick=async()=>{const all2=await pagosAll();const est={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('pv_'))est[k]=localStorage.getItem(k)}
  const b=new Blob([JSON.stringify({app:'cortes-proveedores',version:8,exportado:new Date().toISOString(),pagos:all2,localStorage:est})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='respaldo_pagos_proveedores_'+hoyISO()+'.json';document.body.appendChild(a);a.click();a.remove()};
 $('phimp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.pagos))throw new Error('Archivo no válido');let n=0;for(const p of j.pagos){if(p&&p.id){await pagoPut(p);n++}}
  if(j.localStorage)for(const k in j.localStorage)if(k.startsWith('pv_')&&localStorage.getItem(k)==null)localStorage.setItem(k,j.localStorage[k]);alert(n+' pagos restaurados');render();renderHist()}catch(err){alert('Error al importar: '+err.message)}}}
$('phistBtn').onclick=()=>{const H=$('phist');if(!H.hidden){H.hidden=true;return}renderHist().then(()=>H.scrollIntoView({behavior:'smooth'}))};
$('pcargar').onclick=cargar;
// pestañas
let loaded=false;function tab(t){ss('tab',t);$('secC').hidden=t!='c';$('secP').hidden=t!='p';$('tabC').classList.toggle('on',t=='c');$('tabP').classList.toggle('on',t=='p');if(t=='p'&&!loaded){loaded=true;cargar()}}
$('tabC').onclick=()=>tab('c');$('tabP').onclick=()=>tab('p');
ROWS=ls('pv_rows',[]);if(ROWS.length)rebuild();else PC=ls('pv_ultimos',[]);render();tab(ls('tab','c'));
})();
</script>
<script>
/*XCORE-START*/
// Equivalencias por defecto: clave 'C:<trámite cliente>' / 'P:<trámite proveedor>' -> {g:grupo, i:interno}
const XDEF={'C:Actas':{g:'Actas'},'C:Acta por datos':{g:'Actas'},'P:Actas':{g:'Actas'},'P:Cadenas':{g:''},
'C:RFC económico/Express':{g:'RFC Clon'},'C:RFC con ID/CIF':{g:'RFC Clon'},'C:RFC con domicilio fiscal':{g:'RFC Clon'},'P:Clon':{g:'RFC Clon'},
'P:RFC con domicilio':{g:''},'P:IDCIF':{g:''},
'C:RFC normal':{g:'RFC verificable'},'P:RFC verificable':{g:'RFC verificable'},
'C:RFC alterno':{g:'RFC original'},'P:RFC original':{g:'RFC original'},
'C:Antecedentes penales':{g:'Antecedentes penales'},'P:Antecedentes penales':{g:'Antecedentes penales'},
'C:Semanas cotizadas / vigencias':{g:'Semanas / vigencias'},'P:Semanas / vigencias':{g:'Semanas / vigencias'},
'C:Citas SAT':{g:'Citas SAT'},'P:Citas SAT':{g:'Citas SAT'},'C:Reseteo':{g:'Reseteo'},'P:Reseteo / web':{g:'Reseteo'},
'C:CFE/NSS/No IMSS/CURP':{g:'',i:true},'C:Fecha de retiro':{g:'',i:true},'C:Estado de cuenta':{g:'',i:true},'C:Estado de cuenta Infonavit':{g:'',i:true},'C:Otros':{g:''}};
const XKNOWN=['C:Actas','C:Acta por datos','C:Semanas cotizadas / vigencias','C:CFE/NSS/No IMSS/CURP','C:RFC económico/Express','C:RFC con domicilio fiscal','C:RFC con ID/CIF','C:RFC normal','C:RFC alterno','C:Antecedentes penales','C:Fecha de retiro','C:Citas SAT','C:Reseteo','C:Otros',
'P:Actas','P:Cadenas','P:Clon','P:RFC verificable','P:RFC original','P:RFC con domicilio','P:IDCIF','P:Antecedentes penales','P:Semanas / vigencias','P:Citas SAT','P:Reseteo / web'];
function xEq(k,E){return (E&&E[k])||XDEF[k]||{g:''}}
function xBuild(crows,prows,d,h,E){const G={};const add=(k,side,who,c)=>{const e=xEq(k,E);const nm=k.slice(2);
 const gk=e.i?'INT|'+k:(e.g?'G|'+e.g:'SE|'+k);const g=G[gk]=G[gk]||{g:e.g||nm,interno:!!e.i,sin:!e.i&&!e.g,comprado:0,entregado:0,prov:{},cli:{},tipos:{}};
 g.tipos[k]=1;if(side=='P'){g.comprado+=c;g.prov[who]=(g.prov[who]||0)+c}else{g.entregado+=c;g.cli[who]=(g.cli[who]||0)+c}};
 for(const r of crows){if(r.fecha<d||r.fecha>h)continue;for(const i of r.items)add('C:'+(i.otros?'Otros':i.tramite),'C',(r.cliente||'(sin cliente)').trim()+' · '+(r.gestor||'SIN GESTOR'),i.cantidad)}
 for(const r of prows){if(r.fecha<d||r.fecha>h)continue;for(const i of r.items)if(i.c)add('P:'+i.t,'P',r.prov,i.c)}
 return Object.values(G).map(g=>{g.dif=g.comprado-g.entregado;return g}).sort((a,b)=>(a.interno-b.interno)||(a.sin-b.sin)||a.g.localeCompare(b.g))}
/*XCORE-END*/
(function(){const $=id=>document.getElementById(id);let CR=null,PR=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const xmsg=t=>$('xmsg').textContent=t;const SH='https://docs.google.com/spreadsheets/d/'+SHEET+'/export?format=csv&gid=';
const r0=ls('x_rango',null);$('xdesde').value=r0?r0[0]:$('desde').value;$('xhasta').value=r0?r0[1]:$('hasta').value;
async function get(gid){const r=await fetch(SH+gid+'&_='+Date.now());if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}
async function cargar(force){const d=$('xdesde').value,h=$('xhasta').value;if(!d||!h||d>h)return xmsg('Rango de fechas inválido');ss('x_rango',[d,h]);
 try{if(force||!CR||!PR){xmsg('Cargando ambas hojas…');const[a,b]=await Promise.all([get('0'),get(P_GID)]);CR=parseRows(a);PR=pParse(b)}render();xmsg('Comparación '+pFd(d)+' – '+pFd(h)+' ('+new Date().toLocaleTimeString('es-MX')+')')}catch(e){xmsg('Error al cargar: '+e.message)}}
function render(){if(!CR)return;const E=ls('x_eq',{});const L=xBuild(CR,PR,$('xdesde').value,$('xhasta').value,E);
 const lst=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<li>${esc(k)}: <b>${v}</b></li>`).join('')||'<li>—</li>';
 let h='<tr><th>Trámite</th><th style="text-align:right">Comprado</th><th style="text-align:right">Entregado</th><th style="text-align:right">Diferencia</th><th>Estado</th></tr>';let i=0;
 for(const g of L){const st=g.interno?'<span class="tag">Interno (no se compra)</span>':g.dif==0?'<span style="color:#15803d;font-weight:700">✔ Cuadra</span>':g.dif>0?'<span style="color:#b91c1c;font-weight:700">Faltan entregas/registros</span>':'<span style="color:#c2410c;font-weight:700">Entregado de más</span>';
  const bg=g.interno?'#f1f5f9':g.dif==0?'#dcfce7':g.dif>0?'#fee2e2':'#ffedd5';
  h+=`<tr class="xr" data-i="${i}" style="cursor:pointer;background:${bg}"><td>▸ <b>${esc(g.g)}</b>${g.sin?' <span class="tag" style="background:#fef3c7">Sin equivalencia</span>':''}<div style="font-size:.72rem;color:#64748b">${Object.keys(g.tipos).map(k=>(k[0]=='C'?'Cliente: ':'Proveedor: ')+esc(k.slice(2))).join(' · ')}</div></td><td style="text-align:right">${g.comprado}</td><td style="text-align:right">${g.entregado}</td><td style="text-align:right;font-weight:700">${g.interno?'—':(g.dif>0?'+':'')+g.dif}</td><td>${st}</td></tr>
  <tr id="xd${i}" hidden><td colspan="5"><div style="display:flex;gap:20px;flex-wrap:wrap;font-size:.82rem"><div><b>Por proveedor</b><ul>${lst(g.prov)}</ul></div><div><b>Por cliente · gestor</b><ul>${lst(g.cli)}</ul></div></div></td></tr>`;i++}
 if(!L.length)h+='<tr><td colspan="5">Sin datos en el rango</td></tr>';$('xtab').innerHTML=h;
 document.querySelectorAll('.xr').forEach(r=>r.onclick=()=>{const d=$('xd'+r.dataset.i);d.hidden=!d.hidden;r.cells[0].innerHTML=r.cells[0].innerHTML.replace(/^[▸▾]/,d.hidden?'▸':'▾')})}
function renderEq(){const E=ls('x_eq',{});const ks=new Set(XKNOWN);if(CR)for(const r of CR)for(const i of r.items)ks.add('C:'+(i.otros?'Otros':i.tramite));if(PR)for(const r of PR)for(const i of r.items)ks.add('P:'+i.t);
 const grupos=[...new Set([...ks].map(k=>xEq(k,E).g).filter(Boolean))].sort();
 let h=`<h3 style="margin-top:0">Equivalencias</h3><p style="font-size:.8rem;color:#475569">Los trámites con el mismo <b>Grupo</b> se comparan juntos (comprado vs entregado). Deja el grupo vacío para "Sin equivalencia". Marca <b>Interno</b> si no se compra (se excluye de la diferencia).</p><datalist id="xgl">${grupos.map(g=>`<option value="${esc(g)}">`).join('')}</datalist>
 <div style="overflow-x:auto"><table><tr><th>Hoja</th><th>Trámite</th><th>Grupo</th><th>Interno (no se compra)</th></tr>`;
 for(const k of [...ks].sort((a,b)=>a[0]==b[0]?0:a[0]=='C'?-1:1)){const e=xEq(k,E);h+=`<tr><td>${k[0]=='C'?'Clientes':'Proveedores'}</td><td>${esc(k.slice(2))}</td><td><input list="xgl" class="xg" data-k="${esc(k)}" value="${esc(e.g||'')}"></td><td><input type="checkbox" class="xi" data-k="${esc(k)}" ${e.i?'checked':''}></td></tr>`}
 h+='</table></div><div class="row" style="margin-top:8px"><button id="xeqOk">Guardar y recalcular</button><button class="sec" id="xeqRst">Restablecer por defecto</button></div>';$('xeq').innerHTML=h;
 $('xeqOk').onclick=()=>{const N={};document.querySelectorAll('.xg').forEach(x=>{N[x.dataset.k]={g:x.value.trim(),i:false}});document.querySelectorAll('.xi').forEach(x=>{N[x.dataset.k].i=x.checked});ss('x_eq',N);renderEq();render();xmsg('Equivalencias guardadas')};
 $('xeqRst').onclick=()=>{if(!confirm('¿Restablecer equivalencias por defecto?'))return;localStorage.removeItem('x_eq');renderEq();render()}}
$('xcargar').onclick=()=>cargar(true);$('xeqBtn').onclick=()=>{const p=$('xeq');p.hidden=!p.hidden;if(!p.hidden)renderEq()};
let xl=false;const tabX=()=>{ss('tab','x');['C','P'].forEach(k=>{$('sec'+k).hidden=true;$('tab'+k).classList.remove('on')});$('secX').hidden=false;$('tabX').classList.add('on');if(!xl){xl=true;cargar(false)}};
$('tabX').onclick=tabX;['tabC','tabP'].forEach(id=>$(id).addEventListener('click',()=>{$('secX').hidden=true;$('tabX').classList.remove('on')}));
if(ls('tab','c')=='x')tabX();
})();
</script></body></html>
